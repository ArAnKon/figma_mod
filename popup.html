<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>
      <span class="figma-icon">F</span>
      FigmaMod
    </h1>
    <div class="status" id="statusIndicator">● Выкл</div>
  </div>

  <div class="mode-section">
    <div class="mode-title">Режимы</div>
    <div class="mode-buttons">
      <button id="inspectBtn" class="mode-btn" data-tool="selection">
        <span class="mode-icon">🔍</span>
        <span class="mode-name">Инспектор</span>
        <span class="mode-hotkey">V / 1</span>
      </button>
      <button id="textToolBtn" class="mode-btn">
        <span class="mode-icon">T</span>
        <span class="mode-name">Текст</span>
        <span class="mode-hotkey">T</span>
      </button>
      <button id="quickBtn" class="mode-btn">
        <span class="mode-icon">⌥</span>
        <span class="mode-name">Быстрый</span>
        <span class="mode-hotkey">Alt</span>
      </button>
    </div>
  </div>

  <div class="tools-section">
    <div class="tools-title">Инструменты</div>
    <div class="tools-grid">
      <button class="tool-btn" data-tool="selection">
        <span class="tool-icon">🔍</span>
        <span>Инспектор (V)</span>
      </button>
      <button class="tool-btn" data-tool="distance">
        <span class="tool-icon">📏</span>
        <span>Расстояние</span>
      </button>
      <button id="gridToolBtn" class="tool-btn" data-tool="grid">
        <span class="tool-icon">#</span>
        <span>Сетка</span>
      </button>
      <button id="rulersToolBtn" class="tool-btn" data-tool="rulers">
        <span class="tool-icon">📐</span>
        <span>Линейки</span>
      </button>
    </div>
  </div>

  <div class="features-section">
    <div class="features-title">Новые функции</div>
    <div class="features-grid">
      <button id="paletteBtn" class="feature-btn">
        <span class="feature-icon">🎨</span>
        <span>Палитра</span>
      </button>
      <button id="screenshotBtn" class="feature-btn">
        <span class="feature-icon">📸</span>
        <span>Скриншот</span>
      </button>
      <button id="a11yBtn" class="feature-btn">
        <span class="feature-icon">♿</span>
        <span>A11y Аудит</span>
      </button>
      <button id="mobileBtn" class="feature-btn">
        <span class="feature-icon">📱</span>
        <span>Mobile View</span>
      </button>
    </div>
  </div>

  <div class="state-section">
    <div class="state-title">Симуляция состояний</div>
    <div class="state-buttons">
      <button id="hoverStateBtn" class="state-btn" data-state="hover">
        <span>:hover</span>
      </button>
      <button id="focusStateBtn" class="state-btn" data-state="focus">
        <span>:focus</span>
      </button>
      <button id="activeStateBtn" class="state-btn" data-state="active">
        <span>:active</span>
      </button>
    </div>
  </div>

  <div class="display-section">
    <div class="display-title">Отображение</div>
    <div class="display-controls">
      <label class="display-checkbox">
        <input type="checkbox" id="showColorHex" checked>
        <span>Цвета (HEX)</span>
      </label>
      <label class="display-checkbox">
        <input type="checkbox" id="showDimensions" checked>
        <span>Размеры</span>
      </label>
      <label class="display-checkbox">
        <input type="checkbox" id="showDistances" checked>
        <span>Отступы</span>
      </label>
      <label class="display-checkbox">
        <input type="checkbox" id="snapToElements">
        <span>Привязка</span>
      </label>
      <label class="display-checkbox">
        <input type="checkbox" id="showBoxModel">
        <span>Box Model</span>
      </label>
      <label class="display-checkbox">
        <input type="checkbox" id="showSpacingLabels">
        <span>Отступы (маржин/паддинг)</span>
      </label>
    </div>
  </div>

  <div class="shortcuts-section">
    <div class="shortcuts-title">Горячие клавиши</div>
    <div class="shortcuts-list">
      <div class="shortcut-item">
        <kbd>V</kbd> / <kbd>1</kbd>
        <span>Инспектор</span>
      </div>
      <div class="shortcut-item">
        <kbd>T</kbd>
        <span>Текст / шрифт</span>
      </div>
      <div class="shortcut-item">
        <kbd>Alt</kbd>
        <span>Быстрый режим</span>
      </div>
      <div class="shortcut-item">
        <kbd>Alt+Shift+P</kbd>
        <span>Скриншот</span>
      </div>
      <div class="shortcut-item">
        <kbd>Shift+Cmd/Ctrl+Click</kbd>
        <span>Мультивыбор</span>
      </div>
  <div class="actions-section">
    <button id="clearAllBtn" class="action-btn clear-btn">
      Очистить всё
    </button>
    <button id="disableBtn" class="action-btn disable-btn">
      Отключить
    </button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
